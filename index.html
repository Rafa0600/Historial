<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Análisis de Ventas — Mikra</title>
<meta name="theme-color" content="#080810">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ventas Mikra">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080810; --surface:#0f0f1a; --surface-2:#16162a; --border:#1c1c2e; --border-bright:#2a2a40;
  --text:#e0e0f0; --muted:#6a6a85; --muted-2:#8a8aa5;
  --yellow:#FFE600; --green:#00e676; --blue:#40c4ff; --purple:#d070ff; --orange:#ffaa44; --red:#ff6b6b;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
[hidden]{display:none!important;}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:32px;}

.header{position:sticky;top:0;z-index:50;background:rgba(8,8,16,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
.header-title{font-size:15px;font-weight:700;letter-spacing:-.3px;}
.header-title span{color:var(--yellow);}
.header-sub{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);}
/* barrita de "cargando" (solo aparece si tarda más de 150 ms) */
.loadbar{position:absolute;left:0;right:0;bottom:-1px;height:2px;overflow:hidden;opacity:0;transition:opacity .25s;pointer-events:none;}
.loadbar::before{content:'';position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,var(--yellow),transparent);animation:lb 1.1s infinite ease-in-out;}
@keyframes lb{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
body.loading .loadbar{opacity:1;}
.dimmable{transition:opacity .25s;}
body.loading .dimmable{opacity:.55;}

.wrap{padding:0 12px;max-width:640px;margin:0 auto;}

/* filtros */
.filters{display:flex;flex-direction:column;gap:8px;margin:12px 0;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted-2);padding:6px 12px;
  border:1px solid var(--border-bright);border-radius:20px;background:transparent;cursor:pointer;transition:.15s;user-select:none;}
.chip:active{transform:scale(.96);}
.chip.active{border-color:var(--yellow);background:var(--yellow);color:#000;font-weight:700;}
.chip.acc.active{border-color:var(--purple);background:var(--purple);}
.chip.met.active{border-color:var(--green);background:var(--green);color:#00110a;}
.range-row{display:flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);
  animation:fadeDown .22s var(--ease);}
.range-row input{background:var(--surface-2);border:1px solid var(--border-bright);border-radius:8px;color:var(--text);
  padding:6px 8px;font-family:inherit;font-size:12px;color-scheme:dark;}
@keyframes fadeDown{from{opacity:0;transform:translateY(-4px)}}

/* ── NAVEGADOR DE PERÍODO  ‹ período ›  ── */
.pnav{display:flex;align-items:stretch;gap:6px;}
.pnav-btn{flex:0 0 48px;height:50px;border-radius:13px;border:1px solid var(--border-bright);background:var(--surface);
  color:var(--text);font-size:26px;line-height:1;cursor:pointer;font-family:inherit;
  transition:background .15s,transform .12s,opacity .2s,border-color .2s;user-select:none;}
.pnav-btn:hover:not(:disabled){border-color:var(--muted);}
.pnav-btn:active:not(:disabled){transform:scale(.93);background:var(--surface-2);}
.pnav-btn:disabled{opacity:.22;cursor:default;}
.pnav-mid{flex:1;min-width:0;border-radius:13px;border:1px solid var(--border-bright);background:var(--surface);color:var(--text);
  cursor:pointer;font-family:inherit;overflow:hidden;transition:border-color .25s,background .25s;padding:0 8px;}
.pnav-in{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:100%;}
.pnav-lbl{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.pnav-rng{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--muted-2);white-space:nowrap;}
.pnav-rng .cal{opacity:.55;margin-left:4px;}
.pnav.past .pnav-mid{border-color:rgba(64,196,255,.55);background:rgba(64,196,255,.07);}
.pnav.past .pnav-lbl{color:var(--blue);}
.slide-l .pnav-in{animation:slL .3s var(--ease);}
.slide-r .pnav-in{animation:slR .3s var(--ease);}
@keyframes slL{from{opacity:0;transform:translateX(-22px)}}
@keyframes slR{from{opacity:0;transform:translateX(22px)}}
.pnav-sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.pill{font-family:'Space Mono',monospace;font-size:11.5px;padding:6px 12px;border-radius:20px;border:1px solid var(--border-bright);
  background:transparent;color:var(--muted-2);cursor:pointer;transition:background .15s,border-color .15s,color .15s,transform .1s;white-space:nowrap;}
.pill:active{transform:scale(.95);}
.pill.hoy{border-color:var(--blue);color:var(--blue);animation:pop .25s var(--ease);}
.pill.cmp.on{border-color:var(--blue);background:rgba(64,196,255,.14);color:var(--blue);font-weight:700;}
.pill.rnd{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;}
.pill.rnd.x{color:var(--red);}
@keyframes pop{from{opacity:0;transform:scale(.85)}}

/* hero número */
.hero{background:linear-gradient(135deg,var(--surface),#14142a);border:1px solid rgba(255,230,0,.15);
  border-radius:16px;padding:18px 16px;margin-bottom:12px;text-align:center;touch-action:pan-y;}
.hero-label{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:4px;}
.hero-num{font-family:'Space Mono',monospace;font-size:56px;font-weight:700;color:var(--yellow);line-height:1;
  text-shadow:0 0 30px rgba(255,230,0,.25);font-variant-numeric:tabular-nums;}
.hero-delta{display:inline-flex;align-items:center;gap:6px;margin-top:9px;padding:4px 11px;border-radius:20px;
  font-family:'Space Mono',monospace;font-size:13px;font-weight:700;background:rgba(255,255,255,.04);animation:pop .3s var(--ease);}
.hero-delta span{font-weight:400;font-size:11px;color:var(--muted-2);}
.hero-delta.up{background:rgba(0,230,118,.1);} .hero-delta.dn{background:rgba(255,107,107,.1);}
.hero-meta{display:flex;justify-content:center;gap:18px;margin-top:10px;font-family:'Space Mono',monospace;}
.hm{display:flex;flex-direction:column;}
.hm-v{font-size:16px;font-weight:700;color:var(--text);}
.hm-l{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);}
.hm-d{font-size:10px;font-weight:700;min-height:13px;}
.up{color:var(--green);} .dn{color:var(--red);} .eq{color:var(--muted);}
.err-btn{margin-top:10px;background:none;border:1px solid var(--red);color:var(--red);border-radius:20px;padding:6px 14px;font-family:inherit;cursor:pointer;}

/* ── COMPARACIÓN entre períodos ── */
.cmp-note{font-family:'Space Mono',monospace;font-size:9.5px;color:var(--muted);text-align:right;}
.cmp-cols{display:flex;align-items:flex-end;gap:6px;}
.cc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;border-radius:10px;padding:5px 2px;
  cursor:pointer;transition:background .15s;animation:pop .3s var(--ease) both;}
.cc:hover:not(.cur){background:rgba(255,255,255,.03);}
.cc:active:not(.cur){background:rgba(255,255,255,.06);}
.cc.cur{cursor:default;}
.cc-v{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;white-space:nowrap;color:var(--text);}
.cc.cur .cc-v{color:var(--yellow);}
.cc-d{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;min-height:14px;}
.cc-track{height:84px;width:100%;display:flex;align-items:flex-end;justify-content:center;margin-top:2px;}
.cc-bar{width:62%;max-width:48px;border-radius:7px 7px 2px 2px;min-height:3px;height:0;transition:height .55s var(--ease);opacity:.85;}
.cc.cur .cc-bar{opacity:1;box-shadow:0 0 18px rgba(255,230,0,.25);}
.cc-l{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted-2);margin-top:6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.cc.cur .cc-l{color:var(--text);font-weight:700;}
.cc-avg{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);white-space:nowrap;}
.k0{background:var(--yellow);} .k1{background:var(--blue);} .k2{background:var(--purple);}
.k3{background:var(--green);} .k4{background:var(--orange);} .k5{background:#8a8aa5;} .k6{background:#5a5a75;}

/* paneles */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
.panel-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted-2);}
.panel-title.sku{color:var(--yellow);} .panel-title.color{color:var(--blue);} .panel-title.talle{color:var(--green);}
.filter-note{font-family:'Space Mono',monospace;font-size:10px;color:var(--blue);cursor:pointer;}
.filter-note .x{color:var(--red);margin-left:4px;}

.bar-row{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:default;}
.bar-row.clickable{cursor:pointer;border-radius:6px;}
.bar-row.clickable:hover{background:rgba(255,255,255,.025);}
.bar-row.clickable:active{background:rgba(255,255,255,.05);}
.bar-row.sel{background:rgba(64,196,255,.1);}
.bar-name{flex:0 0 34%;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{flex:1;height:20px;background:var(--surface-2);border-radius:5px;overflow:hidden;position:relative;}
.bar-fill{height:100%;width:0;border-radius:5px;transition:width .5s var(--ease);}
.p-sku .bar-fill{background:linear-gradient(90deg,#b8a000,var(--yellow));}
.p-color .bar-fill{background:linear-gradient(90deg,#2a7db8,var(--blue));}
.p-talle .bar-fill{background:linear-gradient(90deg,#00a152,var(--green));}
/* marca del período ANTERIOR (cuando se compara): rayita vertical donde estaba */
.bar-prev{position:absolute;top:2px;bottom:2px;width:2px;margin-left:-1px;border-radius:1px;background:rgba(255,255,255,.8);
  box-shadow:0 0 0 1px rgba(0,0,0,.35);pointer-events:none;z-index:3;transition:left .5s var(--ease);}
.bar-delta{flex:0 0 auto;font-family:'Space Mono',monospace;font-size:10px;font-weight:700;min-width:44px;text-align:right;white-space:nowrap;}
/* Línea fina de STOCK sobre la barra: llega hasta el stock total; el relleno grueso = vendido */
.bar-stockline{position:absolute;left:0;bottom:2px;height:3px;width:0;border-radius:2px;background:rgba(255,255,255,.5);pointer-events:none;z-index:2;transition:width .5s var(--ease);}
.bar-stockline::after{content:'';position:absolute;right:0;bottom:0;width:2px;height:8px;background:rgba(255,255,255,.85);border-radius:1px;}
.bar-stockline.over{background:rgba(255,90,60,.75);}        /* vendido supera el stock actual */
.bar-stockline.over::after{background:rgba(255,120,90,1);}
/* controles editables del panel de análisis */
.an-ed{white-space:nowrap;text-align:center!important;}
.an-mm{width:24px;height:24px;border:1px solid var(--border-bright);background:var(--surface);color:var(--text);border-radius:6px;font-size:15px;font-weight:800;cursor:pointer;vertical-align:middle;line-height:1;}
.an-mm:active{background:var(--surface-2);}
.an-c{display:inline-block;min-width:26px;text-align:center;font-weight:800;color:var(--yellow);}
.an-c.zero{color:var(--muted);}
.an-fin{color:var(--green);font-weight:700;}
.bar-val{flex:0 0 auto;font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--text);min-width:34px;text-align:right;}
.bar-stock{flex:0 0 auto;font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);min-width:40px;text-align:right;white-space:nowrap;}
.bar-stock b{color:var(--muted-2);font-weight:700;}
/* nombre dentro de la barra (solo se usa en celular) */
.bar-name-in{display:none;}
@media(max-width:600px){
  .bar-name{display:none;}
  .bar-track{height:26px;}
  .bar-row{gap:6px;}
  .bar-delta{min-width:38px;font-size:9.5px;}
  .bar-name-in{display:block;position:absolute;left:8px;right:8px;top:50%;transform:translateY(-50%);
    font-size:11px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    -webkit-text-stroke:0.4px rgba(0,0,0,.85);        /* contorno oscuro en cada letra */
    text-shadow:0 0 3px rgba(0,0,0,.95), 0 0 2px rgba(0,0,0,.9), 0 1px 2px rgba(0,0,0,.9);
    pointer-events:none;z-index:4;}
  .hero-num{font-size:48px;}
}
.empty{color:var(--muted);font-size:12px;text-align:center;padding:16px 0;font-family:'Space Mono',monospace;}
/* botón "separar por artículo" y secciones por artículo */
.sep-toggle{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted-2);background:transparent;
  border:1px solid var(--border-bright);border-radius:20px;padding:4px 10px;cursor:pointer;white-space:nowrap;}
.sep-toggle.on{border-color:var(--green);background:rgba(0,230,118,.12);color:var(--green);font-weight:700;}
.art-sec{margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.art-sec:last-child{border-bottom:none;margin-bottom:0;}
.art-sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 8px;}
.art-sec-left{display:flex;align-items:center;gap:9px;min-width:0;}
.art-sec-img{width:36px;height:36px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--surface-2);border:1px solid var(--border);}
.art-sec-img.ph{display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--border-bright);}
.art-sec-name{font-size:12.5px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.art-sec-total{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--green);flex-shrink:0;text-align:center;}
.art-sec-d{display:block;font-size:10px;}
/* EN LA COMPU: foto grande al costado izquierdo, talles a la derecha (usa el espacio libre). */
@media(min-width:601px){
  .art-sec{display:grid;grid-template-columns:128px 1fr;gap:18px;align-items:center;padding:12px 0;}
  .art-sec-head{grid-column:1;flex-direction:column;align-items:center;text-align:center;gap:7px;margin:0;}
  .art-sec-left{flex-direction:column;align-items:center;gap:9px;width:100%;}
  .art-sec-img{width:110px;height:110px;border-radius:12px;}
  .art-sec-img.ph{font-size:34px;}
  .art-sec-name{white-space:normal;overflow:visible;line-height:1.25;font-size:12px;}
  .art-sec-total{font-size:17px;}
  .art-sec-bars{grid-column:2;min-width:0;}
}

/* ── SELECTOR DE ARTÍCULOS ── */
.sel-open{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
  padding:11px;margin:2px 0 4px;background:rgba(208,112,255,.08);border:1px dashed var(--purple);
  border-radius:12px;color:#e0b3ff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}
.sel-open:active{background:rgba(208,112,255,.16);}
.sel-chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px;}
.sel-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(208,112,255,.12);
  border:1px solid var(--purple);border-radius:20px;padding:5px 6px 5px 11px;font-size:12px;color:#e9ccff;}
.sel-chip img{width:20px;height:20px;border-radius:5px;object-fit:cover;}
.sel-chip button{background:none;border:none;color:#e9ccff;font-size:15px;line-height:1;cursor:pointer;padding:0 2px;}
.sel-clear{background:none;border:1px solid var(--border-bright);color:var(--muted-2);border-radius:20px;
  padding:5px 11px;font-size:11px;font-family:'Space Mono',monospace;cursor:pointer;}

/* ── PANEL DE ANÁLISIS (corte / reposición) ── */
.analizar-btn{width:100%;margin:10px 0 0;padding:12px;border:1px solid var(--blue);background:rgba(64,196,255,.12);color:var(--blue);border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;}
.analizar-btn:active{background:rgba(64,196,255,.22);}
.an-sheet{max-width:740px;}
.an-head{display:flex;gap:12px;align-items:center;margin-bottom:12px;}
.an-img,.an-ph{width:66px;height:66px;border-radius:11px;background:var(--surface-2);flex:0 0 auto;object-fit:cover;}
.an-ph{display:flex;align-items:center;justify-content:center;font-size:28px;}
.an-h-tit{font-size:16px;font-weight:800;color:var(--text);line-height:1.2;}
.an-h-sub{font-size:12px;color:var(--muted);margin-top:4px;}
.an-cfg{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:var(--surface-2);border-radius:11px;padding:11px 13px;margin-bottom:12px;font-size:13px;color:var(--muted-2);}
.an-cfg label{display:flex;align-items:center;gap:7px;}
.an-cfg input{width:66px;background:var(--surface);border:1px solid var(--border-bright);border-radius:8px;color:var(--text);font-size:15px;font-weight:800;padding:6px 8px;text-align:center;font-family:'Space Mono',monospace;}
.an-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.an-tile{background:var(--surface-2);border-radius:11px;padding:10px 6px;text-align:center;}
.an-tile-v{font-family:'Space Mono',monospace;font-size:19px;font-weight:800;color:var(--text);}
.an-tile-l{font-size:10px;color:var(--muted);margin-top:3px;}
.an-tile.hl{background:rgba(64,196,255,.12);}
.an-tile.hl .an-tile-v{color:var(--blue);}
.an-table{width:100%;border-collapse:collapse;font-size:13px;}
.an-table th{font-size:9.5px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;text-align:right;padding:6px 5px;border-bottom:1px solid var(--border-bright);font-weight:700;}
.an-table th:first-child{text-align:left;}
.an-table td{padding:8px 5px;text-align:right;font-family:'Space Mono',monospace;border-bottom:1px solid rgba(255,255,255,.05);color:var(--muted-2);}
.an-table td:first-child{text-align:left;font-family:inherit;font-weight:700;color:var(--text);font-size:14px;}
.an-table tr:last-child td{border-bottom:none;}
.an-cortes{color:var(--yellow);font-weight:800;}
.an-cortes.zero{color:var(--muted);}
.an-prod{color:var(--green);font-weight:700;}
.an-note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:200;
  display:none;align-items:flex-end;justify-content:center;}
.modal.open{display:flex;}
.modal-sheet{width:100%;max-width:640px;background:var(--surface);border:1px solid var(--border-bright);
  border-bottom:none;border-radius:18px 18px 0 0;max-height:88vh;display:flex;flex-direction:column;animation:sheetUp .28s var(--ease);}
@keyframes sheetUp{from{transform:translateY(30px);opacity:.4}}
.modal-top{padding:14px 16px 10px;border-bottom:1px solid var(--border);}
.modal-top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.modal-title{font-size:15px;font-weight:700;}
.modal-x{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1;}
.sel-search{width:100%;background:var(--surface-2);border:1px solid var(--border-bright);border-radius:10px;
  color:var(--text);padding:10px 12px;font-family:inherit;font-size:14px;}
.sel-search:focus{outline:none;border-color:var(--purple);}
.modal-body{overflow-y:auto;padding:12px 16px 20px;}
.cat-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted-2);
  margin:12px 0 8px;display:flex;align-items:center;gap:6px;}
.art-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;}
.art-card{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;overflow:hidden;
  cursor:pointer;position:relative;transition:border-color .15s;}
.art-card.sel{border-color:var(--purple);box-shadow:0 0 0 1px var(--purple);}
.art-card .thumb{width:100%;aspect-ratio:1;object-fit:cover;background:var(--bg);display:block;}
.art-card .thumb-ph{width:100%;aspect-ratio:1;background:var(--bg);display:flex;align-items:center;
  justify-content:center;font-size:1.7em;color:var(--border-bright);}
.art-card .cap{padding:6px 7px;font-size:10.5px;line-height:1.25;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px;}
.art-card .uni{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);padding:0 7px 6px;}
.art-card .tick{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;
  background:var(--purple);color:#fff;display:none;align-items:center;justify-content:center;font-size:12px;}
.art-card.sel .tick{display:flex;}
.sel-empty{color:var(--muted);font-size:12px;text-align:center;padding:20px 0;font-family:'Space Mono',monospace;}
.modal-foot{padding:10px 16px;border-top:1px solid var(--border);display:flex;gap:8px;}
.modal-foot button{flex:1;padding:11px;border-radius:10px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;}
.mf-apply{background:var(--purple);color:#fff;}
.mf-clear{background:var(--surface-2);color:var(--muted-2);border:1px solid var(--border-bright);}

/* ── DÍA POR DÍA ── */
.daily-read{min-height:34px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 10px;
  font-family:'Space Mono',monospace;font-size:11px;color:var(--muted-2);margin-bottom:6px;text-align:center;}
.daily-read b{color:var(--text);}
.daily-read .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0;}
.daily-wrap{position:relative;height:150px;cursor:crosshair;touch-action:pan-y;}
.daily-wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.daily-wrap .db{fill:var(--yellow);opacity:.85;transition:opacity .15s;}
.daily-wrap .db.dim{opacity:.35;}
.daily-wrap .da{fill:rgba(255,230,0,.13);}
.daily-wrap .dl{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;}
.daily-wrap .dl.thick{stroke-width:2.6;}
.daily-wrap .grid{stroke:rgba(255,255,255,.05);stroke-width:1;vector-effect:non-scaling-stroke;}
.daily-wrap .dhl{fill:rgba(255,255,255,.07);}
.s0{stroke:var(--yellow);} .s1{stroke:var(--blue);} .s2{stroke:var(--purple);} .s3{stroke:var(--green);}
.s4{stroke:var(--orange);} .s5{stroke:#8a8aa5;} .s6{stroke:#5a5a75;}
.daily-x{position:relative;height:16px;margin-top:4px;}
.daily-x span{position:absolute;transform:translateX(-50%);font-family:'Space Mono',monospace;font-size:8.5px;color:var(--muted);white-space:nowrap;}
.daily-note{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);text-align:center;padding:14px 0;line-height:1.5;}

/* ── GRÁFICO DE EVOLUCIÓN ── */
.chart-modes{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--border-bright);border-radius:8px;padding:2px;}
.chart-modes .cm{background:none;border:none;color:var(--muted);font-size:11px;font-weight:700;padding:5px 9px;border-radius:6px;cursor:pointer;font-family:inherit;transition:background .15s,color .15s;}
.chart-modes .cm.active{background:var(--orange);color:#1a1000;}
.chart-scroll{overflow-x:auto;padding-bottom:4px;}
.chart{display:flex;align-items:flex-end;gap:6px;height:170px;min-width:min-content;padding-top:18px;}
.cbar-wrap{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:34px;flex:1;cursor:pointer;border-radius:6px;transition:opacity .25s;}
.cbar-wrap:hover{background:rgba(255,255,255,.03);}
.chart.has-sel .cbar-wrap:not(.in){opacity:.42;}
.cbar{width:70%;max-width:26px;background:linear-gradient(180deg,var(--orange),#c47a10);border-radius:4px 4px 0 0;position:relative;transition:height .4s var(--ease);min-height:2px;}
.cbar-val{font-family:'Space Mono',monospace;font-size:8.5px;color:var(--muted-2);margin-bottom:3px;white-space:nowrap;}
.cbar-lbl{font-family:'Space Mono',monospace;font-size:8.5px;color:var(--muted);margin-top:5px;white-space:nowrap;}
.cbar-wrap.in .cbar-lbl{color:var(--text);}
/* comparar años */
.chart-legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:8px;font-family:'Space Mono',monospace;font-size:10px;}
.chart-legend .lg{display:flex;align-items:center;gap:4px;color:var(--muted-2);}
.chart-legend .lg::before{content:'';width:9px;height:9px;border-radius:2px;}
.chart-legend .lg0::before{background:var(--yellow);} .chart-legend .lg1::before{background:var(--blue);} .chart-legend .lg2::before{background:var(--purple);}
.cgroups{display:flex;align-items:flex-end;gap:5px;height:150px;min-width:min-content;}
.cgroup{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:30px;flex:1;}
.cbars{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%;width:100%;}
.cbars .cbar{width:8px;border-radius:2px 2px 0 0;}
.cbars .cbar.y0{background:var(--yellow);} .cbars .cbar.y1{background:var(--blue);} .cbars .cbar.y2{background:var(--purple);}
.cbars .cbar.y3{background:var(--green);} .cbars .cbar.y4{background:var(--orange);}
.chart-legend .lg3::before{background:var(--green);} .chart-legend .lg4::before{background:var(--orange);}
.fbar.y3{background:var(--green);} .fbar.y4{background:var(--orange);}
/* selector de años */
.yr-chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
.yr-chip{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted-2);padding:4px 11px;
  border:1px solid var(--border-bright);border-radius:20px;background:transparent;cursor:pointer;}
.yr-chip.on{border-color:var(--orange);background:rgba(255,170,68,.14);color:var(--orange);font-weight:700;}
.chart-empty{color:var(--muted);font-size:12px;text-align:center;padding:30px 0;font-family:'Space Mono',monospace;}
.chart-hint{text-align:center;font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);margin-bottom:6px;}
.cgroup{cursor:pointer;border-radius:6px;}
.cgroup:active{background:rgba(255,255,255,.05);}
/* vista enfocada (zoom de un mes) */
.focus-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.focus-back{background:var(--surface-2);border:1px solid var(--border-bright);color:var(--muted-2);
  border-radius:20px;padding:5px 11px;font-size:11px;font-family:'Space Mono',monospace;cursor:pointer;}
.focus-back:active{border-color:var(--orange);color:var(--orange);}
.focus-title{font-size:14px;font-weight:700;color:var(--orange);}
.focus-bars{display:flex;align-items:flex-end;justify-content:space-around;gap:14px;height:150px;padding-top:20px;}
.fb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;flex:1;max-width:90px;}
.fb-val{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:var(--text);margin-bottom:5px;white-space:nowrap;}
.fbar{width:60%;max-width:52px;border-radius:5px 5px 0 0;min-height:3px;transition:height .3s;}
.fbar.y0{background:var(--yellow);} .fbar.y1{background:var(--blue);} .fbar.y2{background:var(--purple);}
.fb-lbl{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted-2);margin-top:7px;}

@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important;} }
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="header-title">Análisis de <span>Ventas</span></div>
    <div class="header-sub" id="metaLine">cargando…</div>
  </div>
  <div class="loadbar"></div>
</div>

<div class="wrap">

  <div class="filters">
    <div class="chips" id="periodChips">
      <button class="chip" data-kind="days" data-n="1">Hoy</button>
      <button class="chip" data-kind="days" data-n="7">7 días</button>
      <button class="chip active" data-kind="days" data-n="30">30 días</button>
      <button class="chip" data-kind="days" data-n="90">90 días</button>
      <button class="chip" data-kind="month">Mes</button>
      <button class="chip" data-kind="year">Año</button>
      <button class="chip" data-kind="all">Todo</button>
    </div>
    <!-- Navegador: ‹ ir al período anterior · período actual · ir al siguiente › -->
    <div class="pnav" id="pnav">
      <button class="pnav-btn" id="pPrev" title="Período anterior (←)" aria-label="Período anterior">‹</button>
      <button class="pnav-mid" id="pMid" title="Tocá para elegir fechas a mano">
        <span class="pnav-in"><span class="pnav-lbl" id="pLbl">últimos 30 días</span><span class="pnav-rng" id="pRng">—</span></span>
      </button>
      <button class="pnav-btn" id="pNext" title="Período siguiente (→)" aria-label="Período siguiente">›</button>
    </div>
    <div class="range-row" id="rangeRow" hidden>
      <input type="date" id="desde"> <span>→</span> <input type="date" id="hasta">
    </div>
    <div class="pnav-sub">
      <button class="pill hoy" id="pHoy" hidden>↺ volver a hoy</button>
      <button class="pill cmp" id="cmpBtn">⇄ vs semana anterior</button>
      <button class="pill rnd" id="cmpLess" title="Comparar con uno menos" hidden>−</button>
      <button class="pill rnd" id="cmpMore" title="Sumar otro período anterior" hidden>＋</button>
      <button class="pill rnd x" id="cmpOff" title="Quitar comparación" hidden>✕</button>
    </div>
    <div class="chips" id="accChips"></div>
    <div class="chips" id="metricChips">
      <button class="chip met active" data-metric="unidades">Unidades</button>
      <button class="chip met" data-metric="valor">Valor $</button>
      <button class="chip met" data-metric="gananciaArs">Ganancia $</button>
      <button class="chip met" data-metric="gananciaUsd">Ganan. USD</button>
    </div>
    <div class="chips"><button class="chip" id="stockLineToggle" title="Muestra una línea fina de stock en cada barra (solo en Unidades)">📦 Stock en barras</button></div>
  </div>

  <button class="sel-open" id="selOpen">＋ Analizar artículos puntuales</button>
  <div class="sel-chips" id="selChips" style="display:none"></div>
  <button class="analizar-btn" id="analizarBtn" style="display:none">🔬 Analizar corte / reposición</button>

  <div class="hero dimmable" id="hero">
    <div class="hero-label" id="heroLabel">Unidades vendidas · últimos 30 días</div>
    <div class="hero-num" id="heroNum">—</div>
    <div class="hero-delta" id="heroDelta" hidden></div>
    <div class="hero-meta">
      <div class="hm"><div class="hm-v" id="mOrdenes">—</div><div class="hm-l">unidades</div><div class="hm-d" id="dU"></div></div>
      <div class="hm"><div class="hm-v" id="mValor">—</div><div class="hm-l">valor ARS</div><div class="hm-d" id="dV"></div></div>
      <div class="hm"><div class="hm-v" id="mProm">—</div><div class="hm-l">ganan. ARS</div><div class="hm-d" id="dG"></div></div>
    </div>
  </div>

  <div class="panel dimmable" id="cmpPanel" style="display:none">
    <div class="panel-head"><div class="panel-title" style="color:var(--blue)">Comparación</div>
      <div class="cmp-note" id="cmpNote"></div></div>
    <div class="cmp-cols" id="cmpCols"></div>
  </div>

  <div class="panel dimmable" id="dailyPanel" style="display:none">
    <div class="panel-head">
      <div class="panel-title" style="color:var(--yellow)">Día por día</div>
      <div class="chart-modes" id="dailyModes">
        <button class="cm active" data-dm="dia">Diario</button>
        <button class="cm" data-dm="acum">Acumulado</button>
      </div>
    </div>
    <div id="dailyBody">
      <div class="daily-read" id="dailyRead"></div>
      <div class="daily-wrap" id="dailyWrap"></div>
      <div class="daily-x" id="dailyX"></div>
    </div>
  </div>

  <div class="panel p-chart">
    <div class="panel-head">
      <div class="panel-title" style="color:var(--orange)">Evolución</div>
      <div class="chart-modes">
        <button class="cm active" data-cmode="mes">Por mes</button>
        <button class="cm" data-cmode="anio">Años</button>
        <button class="cm" data-cmode="cuenta">Cuentas</button>
      </div>
    </div>
    <div class="chart-scroll"><div id="chart"></div></div>
  </div>

  <div class="panel p-sku dimmable">
    <div class="panel-head"><div class="panel-title sku">Top artículos</div></div>
    <div id="listSku"></div>
  </div>

  <div class="panel p-color dimmable">
    <div class="panel-head"><div class="panel-title color">Top colores</div>
      <div class="filter-note" id="colorHint" style="display:none"></div></div>
    <div id="listColor"></div>
  </div>

  <div class="panel p-talle dimmable">
    <div class="panel-head"><div class="panel-title talle" id="talleTitle">Top talles</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="sep-toggle" id="sepArt" style="display:none">▦ separar por artículo</button>
        <div class="filter-note" id="talleFilter" style="display:none"></div>
      </div></div>
    <div id="listTalle"></div>
  </div>
</div>

<!-- MODAL SELECTOR DE ARTÍCULOS -->
<div class="modal" id="selModal">
  <div class="modal-sheet">
    <div class="modal-top">
      <div class="modal-top-row">
        <div class="modal-title">Elegí artículos para el análisis</div>
        <button class="modal-x" id="selClose">×</button>
      </div>
      <input class="sel-search" id="selSearch" placeholder="Buscar artículo, color…" autocomplete="off">

      <button class="mf-clear" id="selModalClear">Limpiar</button>
      <button class="mf-apply" id="selModalApply">Aplicar (<span id="selCount">0</span>)</button>
    </div>

</div>

<!-- MODAL DE ANÁLISIS (corte / reposición) -->

  <div class="modal-sheet an-sheet">
    <div class="modal-top">
      <div class="modal-top-row">
        <div class="modal-title">Análisis de corte / reposición</div>
        <button class="modal-x" id="anClose">×</button>
      </div>
    </div>
    <div class="modal-body" id="anBody"></div>
  </div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const WORKER_URL = 'https://ventas-analisis.rafaelassir.workers.dev';
// Worker de inventario (mismo que resumen.html / Pedidos): imágenes + catálogo + stock.
const MIKRA_STOCK = 'https://mikra-stock-cache.rafaelassir.workers.dev';
const TOPN = 20;     // filas que se muestran en Top artículos / colores
const LIMIT = 150;   // filas que se piden (de más, para poder cruzar con el período anterior)
const MAX_CMP = 6;   // hasta cuántos períodos anteriores se pueden comparar

// ── ESTADO ──────────────────────────────────────────────────────────────────
// per = período elegido. kind: days (n días) | month | year | custom | all.
// off = cuántos períodos para atrás (0 = el actual, -1 = el anterior, ...).
// cmp = con cuántos períodos anteriores se compara (0 = sin comparar).
const state = { per:{kind:'days', n:30, off:0}, cmp:0, desde:null, hasta:null,
  cuenta:'', color:'', metric:'unidades', articulos:[], chartMode:'mes', chartFocus:null, chartYears:null,
  showStockLine:false, separarArt:false, _lastData:null, _cmp:[] };
try{ state.showStockLine = localStorage.getItem('showStockLine')==='1'; }catch(e){}

// Métricas disponibles. total/dim = nombre del campo en la respuesta; fmt = cómo se muestra.
const fmt=n=>Math.round(n).toLocaleString('es-AR');
const METRICS = {
  unidades:    {label:'Unidades',   hero:'Unidades vendidas', total:'unidades',         dim:'unidades',    fmt:v=>fmt(v)},
  valor:       {label:'Valor $',    hero:'Valor vendido ARS', total:'valor',            dim:'valor',       fmt:v=>'$'+fmt(v)},
  gananciaArs: {label:'Ganancia $', hero:'Ganancia ARS',      total:'gananciaArs',      dim:'gananciaArs', fmt:v=>'$'+fmt(v)},
  gananciaUsd: {label:'Ganan. USD', hero:'Ganancia USD',      total:'gananciaUsdTotal', dim:'gananciaUsd', fmt:v=>'US$'+fmt(v)},
};

// Cuentas: en la base se guardan CRUDAS (igual que el Excel). El dashboard traduce
// solo para MOSTRAR; el filtro sigue usando el valor crudo, así no hay que tocar la base.
const CUENTA_LABEL = { 'Mirados24':'Chaya', 'TiendaNube':'Tienda Nube', 'Mikra':'Mikra' };
const cuentaLabel = raw => CUENTA_LABEL[raw] || raw;
const CUENTAS = ['Mikra','Mirados24','TiendaNube']; // fallback (valores crudos) si /meta no trae la lista
let RAW_CUENTAS = CUENTAS.slice();

const $=id=>document.getElementById(id);
const fmtMoney=n=>'$'+fmt(n);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ── FECHAS (hora LOCAL; antes usaba UTC y después de las 21 h "hoy" era mañana) ──
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return isoOf(d);};
const todayISO=()=>isoOf(new Date());
const daysAgo=n=>addDays(todayISO(),-(n-1));
const daysBetween=(a,b)=>Math.round((parseISO(b)-parseISO(a))/864e5)+1;   // inclusive
const MESES3=['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MESES=['','enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
const mon=m=>MESES3[+m].toLowerCase();
function fmtDia(s){const [,m,d]=s.split('-');return (+d)+' '+mon(m);}
function fmtDiaY(s){return fmtDia(s)+(s.slice(0,4)!==todayISO().slice(0,4)?' '+s.slice(0,4):'');}
function mesLbl(mes){const [y,mo]=mes.split('-');return MESES3[+mo]+' '+y.slice(2);}
function shortRange(r){
  if(r.desde===r.hasta) return fmtDia(r.desde);
  const [y1,m1,d1]=r.desde.split('-'), [y2,m2,d2]=r.hasta.split('-');
  if(m1===m2&&y1===y2) return `${+d1}–${+d2} ${mon(m1)}`;
  return `${+d1} ${mon(m1)}–${+d2} ${mon(m2)}`;
}

// ── PERÍODOS: rango de cada período y sus nombres ────────────────────────────
function rangeOf(per, off){
  const t=todayISO();
  if(per.kind==='days'){ const h=addDays(t, off*per.n); return {desde:addDays(h,-(per.n-1)), hasta:h}; }
  if(per.kind==='month'){
    const now=new Date(), m=new Date(now.getFullYear(), now.getMonth()+off, 1);
    const last=new Date(m.getFullYear(), m.getMonth()+1, 0);
    return {desde:isoOf(m), hasta: off===0 ? t : isoOf(last)};
  }
  if(per.kind==='year'){ const y=new Date().getFullYear()+off; return {desde:`${y}-01-01`, hasta: off===0 ? t : `${y}-12-31`}; }
  if(per.kind==='custom'){ const L=daysBetween(per.desde,per.hasta); return {desde:addDays(per.desde,off*L), hasta:addDays(per.hasta,off*L)}; }
  return {desde:null, hasta:t};   // all
}
const canGoNext=()=>state.per.kind!=='all' && rangeOf(state.per,state.per.off+1).desde<=todayISO();
const cmpCount=()=>state.per.kind==='all'?0:state.cmp;
// Mes o año EN CURSO: se compara "a la misma altura" (1→28 oct vs 1→28 sep), no contra el mes entero.
const isCut=()=>state.per.off===0 && (state.per.kind==='month'||state.per.kind==='year');

// Rango del período j-ésimo anterior al que se está mirando (j = 1, 2, ...).
function cmpRange(j){
  const r=rangeOf(state.per, state.per.off-j);
  if(isCut()){
    const cur=rangeOf(state.per,0), L=daysBetween(cur.desde,cur.hasta);
    const h=addDays(r.desde,L-1); if(h<r.hasta) r.hasta=h;
  }
  return r;
}

function perLabel(per, off){
  const k=-off;
  if(per.kind==='days'){
    if(per.n===1) return off===0?'hoy':(k===1?'ayer':(k>0?`hace ${k} días`:`${-k} días adelante`));
    if(off===0) return `últimos ${per.n} días`;
    if(per.n===7) return k===1?'semana anterior':`hace ${k} semanas`;
    return k===1?`${per.n} días anteriores`:`${per.n} días · ${k} períodos atrás`;
  }
  if(per.kind==='month'){
    if(off===0) return 'este mes';
    const r=rangeOf(per,off); const [y,m]=r.desde.split('-');
    return MESES[+m]+(y!==todayISO().slice(0,4)?' '+y:'');
  }
  if(per.kind==='year') return off===0?'este año':rangeOf(per,off).desde.slice(0,4);
  if(per.kind==='custom') return off===0?'período elegido':(k===1?'período anterior':(k>0?`${k} períodos atrás`:`${-k} períodos adelante`));
  return 'todo el histórico';
}
function cmpName(){
  const p=state.per;
  if(p.kind==='days'){ if(p.n===1) return p.off===0?'ayer':'día anterior'; if(p.n===7) return 'semana anterior'; return `${p.n} días anteriores`; }
  if(p.kind==='month') return 'mes anterior';
  if(p.kind==='year') return 'año anterior';
  return 'período anterior';
}
// Etiqueta corta de un período (columnas de comparación, leyendas).
function colLabel(r){
  const p=state.per;
  if(p.kind==='month'){ const [y,m]=r.desde.split('-'); return MESES3[+m]+' '+y.slice(2); }
  if(p.kind==='year') return r.desde.slice(0,4);
  if(p.kind==='days' && p.n===1) return DIAS[parseISO(r.desde).getDay()]+' '+fmtDia(r.desde);
  return shortRange(r);
}
function cutNote(){
  if(!isCut()) return '';
  const t=todayISO();
  return state.per.kind==='month' ? `a la misma altura: del 1 al ${+t.slice(8)} de cada mes`
                                  : `a la misma altura: 1 ene → ${fmtDia(t)} de cada año`;
}

// ── DELTAS (▲ / ▼ %) ─────────────────────────────────────────────────────────
function fmtPct(p){const a=Math.abs(p);return (a>=10?Math.round(a):a.toFixed(1).replace('.',','))+'%';}
function deltaInfo(cur,prev){
  cur=cur||0; prev=prev||0;
  if(!prev&&!cur) return null;
  if(!prev) return {txt:'nuevo',cls:'up'};
  const p=(cur-prev)/prev*100;
  if(Math.abs(p)<0.5) return {txt:'= 0%',cls:'eq',p};
  return {txt:(p>0?'▲ ':'▼ ')+fmtPct(p),cls:p>0?'up':'dn',p};
}
function shortNum(v){
  const money=state.metric!=='unidades', pre=state.metric==='gananciaUsd'?'US$':(money?'$':'');
  const a=Math.abs(v), s=v<0?'-':'';
  if(a>=1e6) return s+pre+(a/1e6).toFixed(1).replace('.0','').replace('.',',')+'M';
  if(a>=1e4) return s+pre+Math.round(a/1e3)+'k';
  return s+pre+fmt(a);
}

// ── RED: caché en memoria (ir y volver entre períodos es instantáneo) ────────
const _cache=new Map(), TTL=3*60*1000;
function cachedJSON(url){
  const c=_cache.get(url);
  if(c && Date.now()-c.t<TTL) return c.p;
  const p=fetch(url).then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
  _cache.set(url,{t:Date.now(),p});
  p.catch(()=>_cache.delete(url));
  return p;
}
function filtParams(r, extra){
  const q=new URLSearchParams();
  if(r&&r.desde)q.set('desde',r.desde); if(r&&r.hasta)q.set('hasta',r.hasta);
  if(state.cuenta)q.set('cuenta',state.cuenta); if(state.color)q.set('color',state.color);
  if(state.articulos.length)q.set('articulos',state.articulos.join('|'));
  Object.entries(extra||{}).forEach(([k,v])=>q.set(k,v));
  return q;
}
const fetchQuery    = r => cachedJSON(WORKER_URL+'/query?'+filtParams(r,{metric:state.metric,limit:LIMIT}));
const fetchDesglose = r => cachedJSON(WORKER_URL+'/desglose?'+filtParams(r)).then(d=>d.desglose||[]).catch(()=>[]);
// null = el Worker todavía no tiene /diaria (hay que redeployarlo).
const fetchDiaria   = r => cachedJSON(WORKER_URL+'/diaria?'+filtParams(r)).then(d=>d.dias||null).catch(()=>null);

let _ldT=null;
function setLoading(on){
  clearTimeout(_ldT);
  if(on) _ldT=setTimeout(()=>document.body.classList.add('loading'),150);
  else document.body.classList.remove('loading');
}

// ── ANIMACIONES suaves ───────────────────────────────────────────────────────
// Número que "cuenta" desde el valor anterior al nuevo.
function animNum(el,to,f){
  const from=el._v, sameMetric=el._m===state.metric;
  el._v=to; el._m=state.metric;
  cancelAnimationFrame(el._raf);
  if(REDUCED||from==null||!sameMetric||from===to){ el.textContent=f(to); return; }
  const t0=performance.now(), d=520;
  const step=t=>{ const k=Math.min(1,(t-t0)/d), e=1-Math.pow(1-k,3);
    el.textContent=f(from+(to-from)*e); if(k<1) el._raf=requestAnimationFrame(step); };
  el._raf=requestAnimationFrame(step);
}
// Aplica los tamaños finales en el próximo frame -> las barras crecen/achican con transición.
function settle(root){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    root.querySelectorAll('[data-w]').forEach(x=>x.style.width=x.dataset.w+'%');
    root.querySelectorAll('[data-h]').forEach(x=>x.style.height=x.dataset.h+'%');
    root.querySelectorAll('[data-l]').forEach(x=>x.style.left=x.dataset.l+'%');
  }));
}

// ── BARRAS ───────────────────────────────────────────────────────────────────
// opts: stock {k:n} · prev {k:valor período anterior} · selKey · onClick
function renderBars(el,items,cls,opts={}){
  if(!items||!items.length){el.innerHTML='<div class="empty">sin datos en el período</div>';el._w={};return;}
  const M=METRICS[state.metric], key=M.dim;
  const stock=opts.stock||{}, showStock=Object.keys(stock).length>0;
  // La línea de stock solo si está encendida y la métrica es "unidades" (vendido vs stock).
  const showLine = showStock && state.metric==='unidades' && state.showStockLine;
  const prev=opts.prev||null;
  // Escala común: llega hasta el mayor entre vendido, anterior y stock, para poder comparar.
  let max=Math.max(0,...items.map(i=>i[key]||0));
  if(prev) max=Math.max(max,...items.map(i=>prev[i.k]||0));
  if(showLine) max=Math.max(max,...items.map(i=>stock[i.k]||0));
  max=max||1;
  const old=el._w||{}, now={};
  el.innerHTML=items.map(i=>{
    const v=i[key]||0, w=v>0?Math.max(3,(v/max)*100):0;
    const st=showStock?(stock[i.k]||0):0, sw=Math.min(100,(st/max)*100);
    const pv=prev?(prev[i.k]||0):0, pl=Math.min(100,(pv/max)*100);
    const o=old[i.k]||{w:0,s:0,l:pl};
    now[i.k]={w,s:sw,l:pl};
    const sel=opts.selKey && i.k===opts.selKey ? ' sel':'';
    const clk=opts.onClick ? ' clickable':'';
    const name=esc(i.k);
    const d=prev?deltaInfo(v,pv):null;
    const deltaHtml=prev?`<div class="bar-delta ${d?d.cls:''}" title="antes: ${esc(M.fmt(pv))}">${d?d.txt:''}</div>`:'';
    const stkHtml=showStock?`<div class="bar-stock" title="stock">📦 <b>${fmt(st)}</b></div>`:'';
    const stockLine=showLine?`<div class="bar-stockline${v>st?' over':''}" data-w="${sw}" style="width:${o.s}%" title="stock: ${fmt(st)}"></div>`:'';
    const prevTick=(prev&&pv>0)?`<div class="bar-prev" data-l="${pl}" style="left:${o.l}%" title="${esc(cmpName())}: ${esc(M.fmt(pv))}"></div>`:'';
    return `<div class="bar-row${clk}${sel}" data-k="${encodeURIComponent(i.k)}">
      <div class="bar-name" title="${name}">${name}</div>
      <div class="bar-track"><div class="bar-fill" data-w="${w}" style="width:${o.w}%"></div>${stockLine}${prevTick}<span class="bar-name-in">${name}</span></div>
      <div class="bar-val">${M.fmt(v)}</div>${deltaHtml}${stkHtml}</div>`;
  }).join('');
  el._w=now;
  settle(el);
  if(opts.onClick) el.querySelectorAll('.bar-row').forEach(row=>
    row.onclick=()=>opts.onClick(decodeURIComponent(row.dataset.k)));
}
const prevMap=(list,key)=>{const m={};(list||[]).forEach(x=>m[x.k]=x[key]||0);return m;};

// Orden natural de talles: XS<S<M<L<XL<2XL<3XL ; numéricos por su número (4<6<8, 85<90<95).
function talleOrder(t){
  const s=(t||'').toUpperCase().trim();
  const m={XS:50,S:51,M:52,L:53,XL:54,XXL:55,'2XL':55,XXXL:56,'3XL':56,'4XL':57};
  if(m[s]!==undefined) return m[s];
  const n=parseFloat(s.replace(',','.'));
  return isNaN(n)?999:n;
}

// ── STOCK (del worker mikra-stock-cache) — suma por artículo/color/talle ──────
let STOCK_PRODUCTS=[];   // [{titulo,color,talle,stock}]
function stockPor(dimKey){
  const f=state, m={};
  for(const p of STOCK_PRODUCTS){
    if(f.articulos.length && !f.articulos.includes(p.titulo)) continue;
    if(dimKey==='talle' && f.color && p.color!==f.color) continue;
    const k=p[dimKey]||'—';
    m[k]=(m[k]||0)+(p.stock||0);
  }
  return m;
}
// stock por talle de UN artículo (respeta el color elegido)
function stockArtTalle(articulo){
  const f=state, m={};
  for(const p of STOCK_PRODUCTS){
    if(p.titulo!==articulo) continue;
    if(f.color && p.color!==f.color) continue;
    m[p.talle]=(m[p.talle]||0)+(p.stock||0);
  }
  return m;
}

// ── SEPARAR POR ARTÍCULO (talles de cada artículo elegido) ───────────────────
function renderPorArticulo(el, rows, prevRows){
  const M=METRICS[state.metric], key=M.dim;
  // Ventas por artículo/talle (mapa), para poder cruzarlo con el stock y con el período anterior.
  const sold={}, prev=prevRows?{}:null;
  (rows||[]).forEach(r=>{ (sold[r.articulo]=sold[r.articulo]||{})[r.talle]=r; });
  if(prev) prevRows.forEach(r=>{ (prev[r.articulo]=prev[r.articulo]||{})[r.talle]=r[key]||0; });
  // Mostramos TODOS los artículos elegidos (aunque no hayan vendido nada).
  const arts = state.articulos.length ? state.articulos.slice() : Object.keys(sold);
  const totOf=a=>Object.values(sold[a]||{}).reduce((s,r)=>s+(r[key]||0),0);
  arts.sort((a,b)=>totOf(b)-totOf(a));
  el.innerHTML='';
  arts.forEach(art=>{
    const stk=stockArtTalle(art);          // {talle: stock} para el color actual
    const soldT=sold[art]||{};
    // Todos los talles: los que vendieron + los que tienen stock (aunque hayan vendido 0).
    const tallesSet=new Set([...Object.keys(soldT), ...Object.keys(stk)]);
    const talles=[...tallesSet].filter(t=>t && t!=='—').sort((a,b)=>talleOrder(a)-talleOrder(b))
      .map(t=>{const r=soldT[t]||{}; return {k:t, unidades:r.unidades||0, valor:r.valor||0,
        gananciaArs:r.gananciaArs||0, gananciaUsd:r.gananciaUsd||0};});
    if(!talles.length) return;
    const total=talles.reduce((s,r)=>s+(r[key]||0),0);
    const pa=prev?(prev[art]||{}):null;
    const d=pa?deltaInfo(total,Object.values(pa).reduce((s,v)=>s+v,0)):null;
    const img=articleImage(art);
    const thumb = img
      ? `<img class="art-sec-img" src="${esc(img)}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'art-sec-img ph',textContent:'📦'}))">`
      : `<div class="art-sec-img ph">📦</div>`;
    const sec=document.createElement('div'); sec.className='art-sec';
    sec.innerHTML=`<div class="art-sec-head"><div class="art-sec-left">${thumb}`+
      `<span class="art-sec-name" title="${esc(art)}">${esc(art)}</span></div>`+
      `<span class="art-sec-total">${M.fmt(total)}${d?`<span class="art-sec-d ${d.cls}">${d.txt}</span>`:''}</span></div>`+
      `<div class="art-sec-bars p-talle"></div>`;
    el.appendChild(sec);
    renderBars(sec.querySelector('.art-sec-bars'), talles, 'talle', { stock: stk, prev: pa });
  });
  if(!el.innerHTML) el.innerHTML='<div class="empty">sin datos en el período</div>';
}

// ── CARGA + RENDER ───────────────────────────────────────────────────────────
let _seq=0, _pfT=null;
async function refresh(){
  const my=++_seq;
  const r=rangeOf(state.per,state.per.off);
  state.desde=r.desde; state.hasta=r.hasta;
  syncPeriodUI();
  setLoading(true);
  const cmpRanges=Array.from({length:cmpCount()},(_,i)=>cmpRange(i+1));
  try{
    const [data,...prev]=await Promise.all([fetchQuery(r), ...cmpRanges.map(fetchQuery)]);
    if(my!==_seq) return;                 // llegó tarde: ya se pidió otro período
    state._lastData=data;
    state._cmp=cmpRanges.map((rg,i)=>({...rg, data:prev[i]}));
    renderAll();
  }catch(e){
    if(my!==_seq) return;
    $('heroNum').textContent='—'; $('heroDelta').hidden=true;
    $('heroLabel').innerHTML='No se pudo cargar<br><button class="err-btn" id="retryBtn">↻ reintentar</button>';
    $('retryBtn').onclick=refresh;
  }finally{
    if(my===_seq) setLoading(false);
  }
  if(my!==_seq) return;
  renderChart();
  renderDaily(my);
  // Pre-carga el período anterior: así tocar ‹ es instantáneo.
  clearTimeout(_pfT);
  if(state.per.kind!=='all') _pfT=setTimeout(()=>{ fetchQuery(rangeOf(state.per,state.per.off-1)).catch(()=>{}); },700);
}

// Dibuja todo con los datos ya traídos (sin volver a pedir nada).
function renderAll(){
  const data=state._lastData; if(!data) return;
  const M=METRICS[state.metric], key=M.dim, t=data.total||{};
  const c1=state._cmp[0], d1=c1?c1.data:null, t1=d1?(d1.total||{}):null;
  // El botón "Analizar" aparece cuando hay exactamente 1 artículo seleccionado.
  $('analizarBtn').style.display = state.articulos.length===1 ? 'block' : 'none';

  animNum($('heroNum'), t[M.total]||0, M.fmt);
  const artSuf=state.articulos.length?` · ${state.articulos.length} artículo${state.articulos.length>1?'s':''}`:'';
  $('heroLabel').textContent=M.hero+' · '+perLabel(state.per,state.per.off)+artSuf;
  const hd=$('heroDelta');
  if(t1){
    const d=deltaInfo(t[M.total],t1[M.total]);
    hd.hidden=false; hd.className='hero-delta '+(d?d.cls:'eq');
    const vs=state.per.off===0?cmpName():colLabel(c1);   // mirando para atrás: "vs 8–14 oct" (más claro)
    hd.innerHTML=`${d?d.txt:'—'} <span>vs ${esc(vs)} · ${M.fmt(t1[M.total]||0)}</span>`;
  }else hd.hidden=true;
  // Fila de contexto: siempre unidades, valor ARS y ganancia ARS (con ▲▼ si se compara).
  animNum($('mOrdenes'), t.unidades||0, fmt);
  animNum($('mValor'), t.valor||0, fmtMoney);
  animNum($('mProm'), t.gananciaArs||0, fmtMoney);
  [['dU','unidades'],['dV','valor'],['dG','gananciaArs']].forEach(([id,f])=>{
    const d=t1?deltaInfo(t[f],t1[f]):null;
    $(id).className='hm-d '+(d?d.cls:''); $(id).textContent=d?d.txt:'';
  });

  renderCmp();

  renderBars($('listSku'),(data.topSku||[]).slice(0,TOPN),'sku',{
    stock: stockPor('titulo'),
    prev: d1?prevMap(d1.topSku,key):null,
    selKey: state.articulos.length===1 ? state.articulos[0] : null,
    onClick:(k)=>{ state.articulos = (state.articulos.length===1 && state.articulos[0]===k)?[]:[k];
      renderSelChips(); refresh(); }
  });
  renderBars($('listColor'),(data.topColor||[]).slice(0,TOPN),'color',{
    stock: stockPor('color'),
    prev: d1?prevMap(d1.topColor,key):null,
    selKey:state.color,
    onClick:(k)=>{ state.color = (state.color===k)?'':k; syncColorHint(); refresh(); }
  });

  // Talles: normal (ordenado por talle) o SEPARADO por artículo (2+ elegidos).
  const canSep = state.articulos.length>=2;
  const sb=$('sepArt');
  sb.style.display = canSep?'inline-block':'none';
  if(!canSep) state.separarArt=false;
  sb.textContent = state.separarArt ? '▦ juntar' : '▦ separar por artículo';
  sb.classList.toggle('on', state.separarArt);
  if(state.separarArt && canSep){
    $('talleTitle').textContent='Talles por artículo';
    const my=_seq;
    Promise.all([fetchDesglose({desde:state.desde,hasta:state.hasta}), c1?fetchDesglose(c1):null])
      .then(([rows,prev])=>{ if(my===_seq) renderPorArticulo($('listTalle'),rows,prev); });
  }else{
    $('talleTitle').textContent='Top talles';
    const stkTalle=stockPor('talle');
    let items=(data.topTalle||[]).slice();
    // Con artículo(s) elegido(s): mostrar TODOS los talles (incluye los que tienen stock y vendieron 0).
    if(state.articulos.length){
      const soldMap={}; items.forEach(x=>soldMap[x.k]=x);
      const all=new Set([...Object.keys(soldMap), ...Object.keys(stkTalle)]);
      items=[...all].filter(x=>x&&x!=='—')
        .map(x=>soldMap[x]||{k:x,unidades:0,valor:0,gananciaArs:0,gananciaUsd:0});
    }
    items.sort((a,b)=>talleOrder(a.k)-talleOrder(b.k));
    renderBars($('listTalle'),items,'talle',{ stock: stkTalle, prev: d1?prevMap(d1.topTalle,key):null });
  }
}

// ── PANEL COMPARACIÓN: columnas viejo → actual ───────────────────────────────
function renderCmp(){
  const pnl=$('cmpPanel'), list=state._cmp||[];
  if(!list.length){ pnl.style.display='none'; return; }
  pnl.style.display='';
  const M=METRICS[state.metric];
  const cols=[...list.map((c,i)=>({...c,j:i+1})).reverse(), {desde:state.desde,hasta:state.hasta,data:state._lastData,j:0}];
  const vals=cols.map(c=>((c.data||{}).total||{})[M.total]||0);
  const max=Math.max(1,...vals), unid=state.metric==='unidades';
  const box=$('cmpCols'), old=box._h||{}, now={};
  box.innerHTML=cols.map((c,i)=>{
    const v=vals[i], h=Math.max(2,(v/max)*100), d=i>0?deltaInfo(v,vals[i-1]):null;
    const lbl=c.j===0?perLabel(state.per,state.per.off):colLabel(c);
    const avg=v/daysBetween(c.desde,c.hasta);
    const id=c.desde; now[id]=h;
    return `<div class="cc${c.j===0?' cur':''}" data-j="${c.j}" style="animation-delay:${i*35}ms" title="${esc(fmtDiaY(c.desde)+' → '+fmtDiaY(c.hasta))}">
      <div class="cc-v">${unid?fmt(v):shortNum(v)}</div>
      <div class="cc-d ${d?d.cls:''}">${d?d.txt:''}</div>
      <div class="cc-track"><div class="cc-bar k${c.j}" data-h="${h}" style="height:${old[id]||0}%"></div></div>
      <div class="cc-l">${esc(lbl)}</div>
      <div class="cc-avg">${unid?avg.toFixed(1).replace('.',','):shortNum(avg)}/día</div></div>`;
  }).join('');
  box._h=now; settle(box);
  $('cmpNote').textContent=cutNote()||'tocá uno para ir a ese período';
  // Tocar una columna vieja = ir a ese período.
  box.querySelectorAll('.cc:not(.cur)').forEach(c=>c.onclick=()=>{ go(-(+c.dataset.j)); });
}

// ── DÍA POR DÍA (actual en barras + anteriores en líneas) ────────────────────
let _dailyMode='dia', _dailyState=null;
try{ _dailyMode=localStorage.getItem('dailyMode')||'dia'; }catch(e){}
async function renderDaily(my){
  const pnl=$('dailyPanel');
  const L=state.desde?daysBetween(state.desde,state.hasta):0;
  if(!state.desde || L<2 || L>92){ pnl.style.display='none'; return; }
  const ranges=[{desde:state.desde,hasta:state.hasta}, ...state._cmp];
  const minD=ranges.reduce((m,r)=>r.desde<m?r.desde:m, state.desde);
  const maxH=ranges.reduce((m,r)=>r.hasta>m?r.hasta:m, state.hasta);
  const dias=await fetchDiaria({desde:minD,hasta:maxH});
  if(my!==_seq) return;
  pnl.style.display='';
  if(dias===null){
    $('dailyBody').innerHTML='<div class="daily-note">Para ver el día por día hay que actualizar el Worker<br>(worker-ventas.js → endpoint /diaria).</div>';
    return;
  }
  if(!$('dailyWrap')){   // vuelve a armar el cuerpo si antes mostraba el aviso
    $('dailyBody').innerHTML='<div class="daily-read" id="dailyRead"></div><div class="daily-wrap" id="dailyWrap"></div><div class="daily-x" id="dailyX"></div>';
  }
  const key=METRICS[state.metric].dim, byDay={};
  dias.forEach(d=>byDay[d.dia]=d);
  const series=ranges.map(r=>{ const n=daysBetween(r.desde,r.hasta);
    return Array.from({length:n},(_,i)=>{const day=addDays(r.desde,i); return {day, v:+((byDay[day]||{})[key]||0)};}); });
  _dailyState={series,ranges};
  drawDaily();
}
function drawDaily(){
  if(!_dailyState||!$('dailyWrap')) return;
  const {series,ranges}=_dailyState, M=METRICS[state.metric], acum=_dailyMode==='acum';
  const N=Math.max(...series.map(s=>s.length)), W=N*10, H=100, top=6;
  const vals=series.map(s=>{ let c=0; return s.map(x=>acum?(c+=x.v):x.v); });
  const max=Math.max(1,...vals.flat());
  const y=v=>H-(v/max)*(H-top);
  let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  [0.25,0.5,0.75].forEach(f=>svg+=`<line class="grid" x1="0" x2="${W}" y1="${y(max*f)}" y2="${y(max*f)}"/>`);
  svg+=`<rect class="dhl" id="dHl" x="-20" y="0" width="10" height="${H}"/>`;
  if(acum){
    const pts=vals[0].map((v,i)=>`${i*10+5},${y(v)}`).join(' ');
    svg+=`<polygon class="da" points="5,${H} ${pts} ${(vals[0].length-1)*10+5},${H}"/>`;
  }else{
    svg+=vals[0].map((v,i)=>`<rect class="db" x="${i*10+1.5}" y="${y(v)}" width="7" height="${H-y(v)}"/>`).join('');
  }
  for(let j=vals.length-1;j>=1;j--){
    svg+=`<polyline class="dl s${j}" points="${vals[j].map((v,i)=>`${i*10+5},${y(v)}`).join(' ')}"/>`;
  }
  if(acum) svg+=`<polyline class="dl thick s0" points="${vals[0].map((v,i)=>`${i*10+5},${y(v)}`).join(' ')}"/>`;
  svg+='</svg>';
  const wrap=$('dailyWrap'); wrap.innerHTML=svg;
  // Eje X: algunas fechas del período actual.
  const cur=series[0], step=N<=10?1:Math.ceil(N/8);
  $('dailyX').innerHTML=cur.map((x,i)=>{
    if(i%step && i!==cur.length-1) return '';
    if(i!==cur.length-1 && cur.length-1-i<step/2 && step>1) return '';
    const dd=parseISO(x.day), lbl=N<=10?`${DIAS[dd.getDay()]} ${dd.getDate()}`:`${dd.getDate()}/${dd.getMonth()+1}`;
    return `<span style="left:${(i*10+5)/W*100}%">${lbl}</span>`;
  }).join('');
  // Lectura: al tocar/pasar por un día muestra los valores de cada período ese día.
  const read=i=>{
    if(i==null){
      $('dailyRead').innerHTML=ranges.length>1
        ? `<span>tocá un día para comparar · ${acum?'acumulado':'por día'}</span>`
        : `<span>tocá un día para ver el detalle</span>`;
      $('dHl').setAttribute('x',-20); return;
    }
    $('dHl').setAttribute('x',i*10);
    wrap.querySelectorAll('.db').forEach((b,bi)=>b.classList.toggle('dim',bi!==i));
    const v0=vals[0][i];
    $('dailyRead').innerHTML=series.map((s,j)=>{
      if(!s[i]) return '';
      const dd=parseISO(s[i].day), v=vals[j][i];
      const d=j>0&&v0!=null?deltaInfo(v0,v):null;
      return `<span><i class="dot k${j}"></i>${DIAS[dd.getDay()]} ${fmtDia(s[i].day)} <b>${M.fmt(v)}</b>${d?` <span class="${d.cls}">${d.txt}</span>`:''}</span>`;
    }).join('');
  };
  const idxAt=e=>{ const r=wrap.getBoundingClientRect(); return Math.max(0,Math.min(N-1,Math.floor((e.clientX-r.left)/r.width*N))); };
  wrap.onpointermove=e=>read(idxAt(e));
  wrap.onpointerdown=e=>read(idxAt(e));
  wrap.onpointerleave=e=>{ if(e.pointerType==='mouse'){ read(null); wrap.querySelectorAll('.db').forEach(b=>b.classList.remove('dim')); } };
  read(null);
}

function groupedChart(el,M,key,groupsData,legendItems,headerHtml){
  // groupsData: [{label, bars:[{v, cls, title}]}]; legendItems: [{txt, cls}]; headerHtml opcional arriba
  headerHtml = headerHtml || '';
  el.className='';
  // Vista enfocada: se tocó un mes -> se muestra solo ese, grande, con valores.
  if(state.chartFocus){
    const g=groupsData.find(x=>x.label===state.chartFocus);
    if(g){
      const max=Math.max(...g.bars.map(b=>b.v),1);
      el.innerHTML=headerHtml+`<div class="focus-head"><button class="focus-back">← ver todos</button>`+
        `<span class="focus-title">${g.label}</span></div>`+
        `<div class="focus-bars">`+g.bars.map((b,i)=>{const h=Math.max(2,(b.v/max)*100);
          return `<div class="fb"><div class="fb-val">${M.fmt(b.v)}</div>`+
            `<div class="fbar ${b.cls}" style="height:${h}%"></div>`+
            `<div class="fb-lbl">${(legendItems[i]||{}).txt||''}</div></div>`;}).join('')+`</div>`;
      el.querySelector('.focus-back').onclick=()=>{ state.chartFocus=null; renderChart(); };
      return;
    }
    state.chartFocus=null;
  }
  const max=Math.max(...groupsData.flatMap(g=>g.bars.map(b=>b.v)),1);
  const legend='<div class="chart-legend">'+legendItems.map(l=>`<span class="lg ${l.cls}">${l.txt}</span>`).join('')+'</div>';
  const hint='<div class="chart-hint">tocá un mes para verlo de cerca</div>';
  const groups='<div class="cgroups">'+groupsData.map(g=>{
    const bars=g.bars.map(b=>{const h=Math.max(1,(b.v/max)*100);
      return `<div class="cbar ${b.cls}" style="height:${h}%" title="${b.title||''}"></div>`;}).join('');
    return `<div class="cgroup" data-focus="${g.label}"><div class="cbars">${bars}</div><div class="cbar-lbl">${g.label}</div></div>`;
  }).join('')+'</div>';
  el.innerHTML=headerHtml+legend+hint+groups;
  el.querySelectorAll('.cgroup').forEach(c=>c.onclick=()=>{ state.chartFocus=c.dataset.focus; renderChart(); });
}

let _chartSeq=0;
async function renderChart(){
  const el=$('chart'), M=METRICS[state.metric], key=M.dim, my=++_chartSeq;

  if(state.chartMode==='mes'){
    const serie=await fetchSerie();
    if(my!==_chartSeq) return;
    if(!serie.length){ el.className=''; el.innerHTML='<div class="chart-empty">sin datos</div>'; return; }
    const months=serie.slice(-14);
    const max=Math.max(...months.map(m=>m[key]||0),1);
    const dM=state.desde?state.desde.slice(0,7):'0000-00', hM=(state.hasta||todayISO()).slice(0,7);
    el.className='chart'+(state.per.kind!=='all'?' has-sel':'');
    el.innerHTML=months.map(m=>{const v=m[key]||0,h=Math.max(2,(v/max)*100), inn=m.mes>=dM&&m.mes<=hM;
      return `<div class="cbar-wrap${inn?' in':''}" data-mes="${m.mes}" title="${mesLbl(m.mes)}: ${M.fmt(v)} · tocá para ver ese mes"><div class="cbar-val">${shortNum(v)}</div>`+
        `<div class="cbar" style="height:${h}%"></div>`+
        `<div class="cbar-lbl">${mesLbl(m.mes)}</div></div>`;}).join('');
    // Tocar un mes = ver ese mes (y desde ahí podés ir ‹ › o comparar).
    el.querySelectorAll('.cbar-wrap').forEach(b=>b.onclick=()=>{
      const [y,mo]=b.dataset.mes.split('-').map(Number), now=new Date();
      const off=(y-now.getFullYear())*12+(mo-1-now.getMonth());
      state.per={kind:'month',off}; slide(0); refresh();
      window.scrollTo({top:0,behavior:'smooth'});
    });

  }else if(state.chartMode==='anio'){
    // Compara MES POR MES entre los años elegidos.
    const serie=await fetchSerie();
    if(my!==_chartSeq) return;
    if(!serie.length){ el.className=''; el.innerHTML='<div class="chart-empty">sin datos</div>'; return; }
    const byMonth={}, yset=new Set();
    serie.forEach(m=>{const [y,mo]=m.mes.split('-');yset.add(y);(byMonth[mo]=byMonth[mo]||{})[y]=m[key]||0;});
    const allYears=[...yset].sort();
    let sel=(state.chartYears||allYears.slice(-3)).filter(y=>allYears.includes(y));
    if(!sel.length) sel=allYears.slice(-1);
    const header='<div class="yr-chips">'+allYears.map(y=>`<button class="yr-chip${sel.includes(y)?' on':''}" data-y="${y}">${y}</button>`).join('')+'</div>';
    groupedChart(el,M,key,
      Array.from({length:12},(_,i)=>{const mo=String(i+1).padStart(2,'0');
        return {label:MESES3[i+1], bars:sel.map((y,yi)=>({v:(byMonth[mo]||{})[y]||0,cls:'y'+yi,title:`${MESES3[i+1]} ${y}: ${M.fmt((byMonth[mo]||{})[y]||0)}`}))};}),
      sel.map((y,i)=>({txt:y,cls:'lg'+i})), header);
    el.querySelectorAll('.yr-chip').forEach(c=>c.onclick=()=>{
      const y=c.dataset.y; let cur=(state.chartYears||allYears.slice(-3)).slice();
      cur = cur.includes(y) ? cur.filter(x=>x!==y) : cur.concat(y);
      cur.sort(); state.chartYears = cur.length?cur:null; state.chartFocus=null; renderChart();
    });

  }else{ // cuenta
    const serie=await fetchSerieCuenta();
    if(my!==_chartSeq) return;
    if(!serie.length){ el.className=''; el.innerHTML='<div class="chart-empty">sin datos</div>'; return; }
    const byMonth={}, accs=new Set();
    serie.forEach(r=>{accs.add(r.cuenta);(byMonth[r.mes]=byMonth[r.mes]||{})[r.cuenta]=r[key]||0;});
    const accList=[...accs].sort();
    const months=Object.keys(byMonth).sort().slice(-12);
    groupedChart(el,M,key,
      months.map(mes=>({label:mesLbl(mes), bars:accList.map((a,ai)=>({v:(byMonth[mes]||{})[a]||0,cls:'y'+ai,title:`${cuentaLabel(a)} ${mesLbl(mes)}: ${M.fmt((byMonth[mes]||{})[a]||0)}`}))})),
      accList.map((a,i)=>({txt:cuentaLabel(a),cls:'lg'+i})));
  }
}

function slide(dir){
  const p=$('pnav'); p.classList.remove('slide-l','slide-r');
  if(!dir) return; void p.offsetWidth; p.classList.add(dir<0?'slide-l':'slide-r');
}
function go(dir){
  const p=state.per;
  if(p.kind==='all' || !dir) return;
  if(dir>0 && !canGoNext()) return;
  if(dir>0){ // no pasarse del presente
    let n=0; while(n<dir && canGoNext()){ p.off++; n++; }
  }else p.off+=dir;
  slide(dir); refresh();
}
function backToNow(){ if(!state.per.off) return; const dir=-state.per.off; state.per.off=0; slide(dir); refresh(); }

  // Comparación

  if(state.color) q.set('color',state.color);
  if(state.cuenta) q.set('cuenta',state.cuenta);
  try{ const d=await (await fetch(WORKER_URL+'/query?'+q)).json();
    (d.topTalle||[]).forEach(t=>{ if(t.k) v[t.k]=(v[t.k]||0)+(t.unidades||0); });
  }catch(e){}
  return v;
}

// Cortes recomendados por talle: para cubrir N días necesito ~lo vendido en N días.
function _anRecomendacion(){
  const {ventas,stock,rinde}=_an, rec={};
  [...new Set([...Object.keys(ventas),...Object.keys(stock)])].forEach(t=>{
    const falt=Math.max(0,(ventas[t]||0)-(stock[t]||0));
    rec[t]=Math.ceil(falt/rinde);
  });
  return rec;
}

async function openAnalisis(){
  if(state.articulos.length!==1) return;
  const cfg=anCfg();
  _an={ art:state.articulos[0], dias:cfg.dias||30, rinde:cfg.rinde||100, ventas:{}, stock:{}, cortes:{} };
  $('anBody').innerHTML='<div class="empty">cargando…</div>';
  $('analisisModal').classList.add('open');
  await _anReload();
}

// Re-trae ventas del período y resetea la recomendación (al cambiar días o rinde).
async function _anReload(){
  _an.ventas = await _anFetchVentas(_an.art, _an.dias);
  _an.stock  = stockPor('talle');
  _an.cortes = _anRecomendacion();
  _anRender();
}

function _anRender(){
  const {art,dias,rinde,ventas,stock,cortes}=_an;
  const img=articleImage(art);
  const thumb = img
    ? `<img class="an-img" src="${esc(img)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'an-ph',textContent:'📦'}))">`
    : `<div class="an-ph">📦</div>`;
  const talles=[...new Set([...Object.keys(ventas),...Object.keys(stock)])].filter(t=>t&&t!=='—').sort((a,b)=>talleOrder(a)-talleOrder(b));

  let tVend=0,tStock=0,tCortes=0,tFinal=0;
  const rows=talles.map(t=>{
    const v=ventas[t]||0, s=stock[t]||0, c=cortes[t]||0, fin=s+c*rinde;
    tVend+=v; tStock+=s; tCortes+=c; tFinal+=fin;
    return `<tr><td>${esc(t)}</td><td>${fmt(v)}</td><td>${fmt(s)}</td>`+
      `<td class="an-ed"><button class="an-mm" data-t="${esc(t)}" data-d="-1">−</button>`+
      `<span class="an-c${c?'':' zero'}">${c}</span>`+
      `<button class="an-mm" data-t="${esc(t)}" data-d="1">+</button></td>`+
      `<td class="an-fin">${fmt(fin)}</td></tr>`;
  }).join('');

  $('anBody').innerHTML=`
    <div class="an-head">${thumb}<div><div class="an-h-tit">${esc(art)}</div>
      <div class="an-h-sub">Ventas de los últimos <b>${dias}</b> días · para cubrir <b>${dias}</b> días${state.color?` · ${esc(state.color)}`:''}</div></div></div>
    <div class="an-cfg">
      <label>Días <input id="anDias" type="number" min="1" value="${dias}"></label>
      <label>Rinde/corte <input id="anRinde" type="number" min="1" value="${rinde}"></label>
    </div>
    <div class="an-tiles">
      <div class="an-tile"><div class="an-tile-v">${fmt(tVend)}</div><div class="an-tile-l">vendido ${dias}d</div></div>
      <div class="an-tile"><div class="an-tile-v">${fmt(tStock)}</div><div class="an-tile-l">stock hoy</div></div>
      <div class="an-tile hl"><div class="an-tile-v">${fmt(tCortes)}</div><div class="an-tile-l">cortes</div></div>
      <div class="an-tile"><div class="an-tile-v">${fmt(tFinal)}</div><div class="an-tile-l">quedás con</div></div>
    </div>
    <table class="an-table">
      <thead><tr><th>Talle</th><th>Vend.</th><th>Stock</th><th>Cortes</th><th>Quedás</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="5" class="empty">sin talles</td></tr>'}</tbody>
    </table>
    <div class="an-note">Recomendación: para cubrir ${dias} días necesitás ~lo vendido en ${dias} días. Ajustá los cortes con − / + (0 = salteás ese talle). "Quedás" = stock + cortes × rinde.</div>`;

  $('anDias').onchange=e=>{ _an.dias=Math.max(1,parseInt(e.target.value,10)||30); anSaveCfg({dias:_an.dias,rinde:_an.rinde}); $('anBody').innerHTML='<div class="empty">cargando…</div>'; _anReload(); };
  $('anRinde').onchange=e=>{ _an.rinde=Math.max(1,parseInt(e.target.value,10)||100); anSaveCfg({dias:_an.dias,rinde:_an.rinde}); _an.cortes=_anRecomendacion(); _anRender(); };
  $('anBody').querySelectorAll('.an-mm').forEach(b=>b.onclick=()=>{
    const t=b.dataset.t; _an.cortes[t]=Math.max(0,(_an.cortes[t]||0)+(+b.dataset.d)); _anRender();
  });
}

$('analizarBtn').onclick=openAnalisis;
$('anClose').onclick=()=>$('analisisModal').classList.remove('open');
$('analisisModal').onclick=e=>{ if(e.target===$('analisisModal')) $('analisisModal').classList.remove('open'); };

function openModal(){ _selBuf=new Set(state.articulos); $('selSearch').value=''; renderModal(); $('selModal').classList.add('open'); }
function closeModal(){ $('selModal').classList.remove('open'); }
function applyModal(){ state.articulos=[..._selBuf]; closeModal(); renderSelChips(); refresh(); }
function renderSelChips(){
  const el=$('selChips');
  if(!state.articulos.length){ el.style.display='none'; $('selOpen').textContent='＋ Analizar artículos puntuales'; return; }
  el.style.display='flex'; $('selOpen').textContent='✎ Editar artículos del análisis';
  el.innerHTML=state.articulos.map(n=>{
    const img=articleImage(n);
    return `<span class="sel-chip">${img?`<img src="${esc(img)}">`:''}${esc(n)}<button data-n="${encodeURIComponent(n)}">×</button></span>`;
  }).join('')+`<button class="sel-clear" id="selChipsClear">limpiar todo</button>`;
  el.querySelectorAll('.sel-chip button').forEach(b=>b.onclick=()=>{
    state.articulos=state.articulos.filter(x=>x!==decodeURIComponent(b.dataset.n)); renderSelChips(); refresh();
  });
  const clr=$('selChipsClear'); if(clr) clr.onclick=()=>{ state.articulos=[]; renderSelChips(); refresh(); };
}
$('selOpen').onclick=openModal;
$('selClose').onclick=closeModal;
$('selModal').onclick=e=>{ if(e.target===$('selModal')) closeModal(); };
$('selSearch').oninput=renderModal;
$('selModalApply').onclick=applyModal;
$('selModalClear').onclick=()=>{ _selBuf=new Set(); renderModal(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeModal(); $('analisisModal').classList.remove('open'); } });

// ── INIT ─────────────────────────────────────────────────────────────────────
async function init(){
  syncColorHint();
  buildAccChips(CUENTAS);
  // Todo en paralelo: datos del período, meta y stock/fotos.
  refresh();
  fetch(WORKER_URL+'/meta').then(r=>r.json()).then(m=>{
    $('metaLine').textContent=`${fmt(m.count)} ventas · ${m.minFecha} → ${m.maxFecha}`;
    if(m.cuentas&&m.cuentas.length&&m.cuentas.join()!==CUENTAS.join()){ RAW_CUENTAS=m.cuentas; buildAccChips(m.cuentas); }
  }).catch(()=>{ $('metaLine').textContent='error de conexión'; });
  // Cuando llega el stock/fotos se vuelve a dibujar con lo que ya hay (sin volver a pedir ventas).
  loadSelectorData().then(()=>{ renderSelChips(); renderAll(); });
}
init();
</script>

  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
